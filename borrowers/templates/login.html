<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountryWide Finance — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary:       #0a4f2e;
            --primary-light: #0e6b3e;
            --accent:        #c9a02a;
            --radius:        14px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Inter', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #062d1a 0%, #0a4f2e 50%, #0e6b3e 100%);
        }

        .login-wrapper {
            display: flex;
            width: 100%;
            max-width: 900px;
            min-height: 520px;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin: 24px;
        }

        /* Left brand panel */
        .login-brand {
            flex: 1;
            background: linear-gradient(160deg, rgba(255,255,255,0.06) 0%, rgba(255,255,255,0.02) 100%);
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .login-brand::before {
            content: '₦';
            position: absolute;
            font-size: 260px;
            font-weight: 700;
            color: rgba(255,255,255,0.04);
            bottom: -40px;
            right: -20px;
            line-height: 1;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 40px;
        }

        .brand-icon {
            width: 52px; height: 52px;
            background: var(--accent);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px;
        }

        .brand-name {
            font-size: 22px;
            font-weight: 700;
        }

        .brand-sub {
            font-size: 12px;
            color: rgba(255,255,255,0.55);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-tagline {
            font-size: 28px;
            font-weight: 700;
            line-height: 1.35;
            margin-bottom: 16px;
        }

        .brand-desc {
            font-size: 14px;
            color: rgba(255,255,255,0.65);
            line-height: 1.7;
        }

        /* Right form panel */
        .login-form-panel {
            width: 380px;
            background: #ffffff;
            padding: 48px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-form-panel h2 {
            font-size: 22px;
            font-weight: 700;
            color: #1a1a2e;
            margin-bottom: 6px;
        }

        .login-form-panel p {
            font-size: 13px;
            color: #6c757d;
            margin-bottom: 32px;
        }

        .form-group { margin-bottom: 18px; }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1a1a2e;
            margin-bottom: 7px;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
            font-size: 14px;
        }

        .input-icon-wrap input {
            width: 100%;
            padding: 10px 14px 10px 40px;
            border: 1.5px solid #e2e8f0;
            border-radius: 8px;
            font-size: 14px;
            font-family: 'Inter', Arial, sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .input-icon-wrap input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10,79,46,0.1);
        }

        .btn-login {
            width: 100%;
            padding: 11px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: opacity 0.2s, transform 0.1s;
            font-family: 'Inter', Arial, sans-serif;
        }

        .btn-login:hover { opacity: 0.92; transform: translateY(-1px); }
        .btn-login:active { transform: translateY(0); }

        @media (max-width: 640px) {
            .login-brand { display: none; }
            .login-form-panel { width: 100%; }
        }
    </style>
</head>
<body>

<div class="login-wrapper">

    <!-- Brand Panel -->
    <div class="login-brand">
        <div class="brand-logo">
            <div class="brand-icon">🏦</div>
            <div>
                <div class="brand-name">CountryWide</div>
                <div class="brand-sub">Microfinance</div>
            </div>
        </div>
        <div class="brand-tagline">Empowering Communities<br>Through Finance</div>
        <div class="brand-desc">
            Manage loans, borrowers, repayments, and reports — all from one secure platform built for your team.
        </div>
    </div>

    <!-- Form Panel -->
    <div class="login-form-panel">
        <h2>Staff Login</h2>
        <p>Sign in to access your dashboard</p>

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Username</label>
                <div class="input-icon-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" name="username" placeholder="Enter your username" autocomplete="username">
                </div>
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="input-icon-wrap">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" name="password" placeholder="Enter your password" autocomplete="current-password">
                </div>
            </div>

            <button type="submit" class="btn-login">
                <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
            </button>
        </form>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
