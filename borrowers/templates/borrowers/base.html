<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountryWide Lending and Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary:       #0a4f2e;
            --primary-light: #0e6b3e;
            --primary-dark:  #062d1a;
            --accent:        #c9a02a;
            --accent-light:  #f0c93a;
            --danger:        #c0392b;
            --sidebar-width: 260px;
            --bg:            #f4f6f9;
            --card-bg:       #ffffff;
            --text:          #1a1a2e;
            --text-muted:    #6c757d;
            --border:        #e2e8f0;
            --shadow:        0 2px 12px rgba(0,0,0,0.08);
            --shadow-md:     0 4px 20px rgba(0,0,0,0.12);
            --radius:        12px;
            --radius-sm:     8px;
            --topbar-h:      56px; /* mobile top bar height */
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            min-height: 100vh;
        }

        /* ── OVERLAY (mobile) ── */
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.45);
            z-index: 99;
        }

        .sidebar-overlay.active { display: block; }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: linear-gradient(180deg, var(--primary-dark) 0%, var(--primary) 100%);
            color: white;
            padding: 0;
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 4px 0 20px rgba(0,0,0,0.15);
            transition: transform 0.28s cubic-bezier(.4,0,.2,1);
        }

        .sidebar-logo {
            padding: 24px 20px 20px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo .logo-icon {
            width: 42px; height: 42px;
            background: var(--accent);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }

        .sidebar-logo .logo-text {
            font-size: 17px;
            font-weight: 700;
            line-height: 1.2;
            letter-spacing: 0.2px;
        }

        .sidebar-logo .logo-sub {
            font-size: 11px;
            color: rgba(255,255,255,0.55);
            font-weight: 400;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Close button inside sidebar — only visible on mobile */
        .sidebar-close-btn {
            display: none;
            position: absolute;
            top: 14px;
            right: 14px;
            background: rgba(255,255,255,0.12);
            border: none;
            color: white;
            width: 30px; height: 30px;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            align-items: center;
            justify-content: center;
        }

        .sidebar-nav {
            flex: 1;
            padding: 16px 12px;
            overflow-y: auto;
        }

        .menu {
            list-style: none;
            padding: 0; margin: 0;
        }

        .menu li { margin: 2px 0; }

        .menu a {
            color: rgba(255,255,255,0.82);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .menu a:hover,
        .menu a.active {
            background: rgba(255,255,255,0.12);
            color: #ffffff;
        }

        .menu a i {
            width: 18px;
            text-align: center;
            font-size: 15px;
            opacity: 0.85;
        }

        .section {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: rgba(255,255,255,0.38);
            padding: 16px 14px 6px;
            margin-top: 4px;
        }

        .sidebar-footer {
            padding: 16px 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        .sidebar-footer a {
            color: rgba(255,255,255,0.65);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }

        .sidebar-footer a:hover {
            background: rgba(192,57,43,0.25);
            color: #ff8a80;
        }

        /* ── MOBILE TOP BAR ── */
        .mobile-topbar {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: var(--topbar-h);
            background: linear-gradient(90deg, var(--primary-dark), var(--primary));
            z-index: 98;
            align-items: center;
            padding: 0 16px;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
        }

        .mobile-topbar .hamburger {
            background: rgba(255,255,255,0.12);
            border: none;
            color: white;
            width: 36px; height: 36px;
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .mobile-topbar .mob-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }

        .mobile-topbar .mob-logo .logo-icon {
            width: 32px; height: 32px;
            background: var(--accent);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px;
        }

        .mobile-topbar .mob-logo span {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }

        /* ── MAIN CONTENT ── */
        .content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 32px 36px;
            min-height: 100vh;
        }

        /* ── TOP BAR ── */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .topbar .page-title {
            font-size: 22px;
            font-weight: 700;
            color: var(--text);
        }

        .topbar .badge-role {
            background: var(--primary);
            color: white;
            font-size: 12px;
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: 500;
        }

        /* ── CARDS ── */
        .card {
            border: none !important;
            border-radius: var(--radius) !important;
            box-shadow: var(--shadow) !important;
            background: var(--card-bg) !important;
        }

        /* ── STAT CARDS ── */
        .stat-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 22px 24px;
            display: flex;
            align-items: center;
            gap: 18px;
            transition: box-shadow 0.2s;
        }

        .stat-card:hover { box-shadow: var(--shadow-md); }

        .stat-icon {
            width: 52px; height: 52px;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
        }

        .stat-icon.green  { background: rgba(10,79,46,0.12); color: var(--primary); }
        .stat-icon.gold   { background: rgba(201,160,42,0.15); color: var(--accent); }
        .stat-icon.blue   { background: rgba(37,99,235,0.1);  color: #2563eb; }
        .stat-icon.red    { background: rgba(192,57,43,0.1);  color: var(--danger); }

        .stat-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 26px;
            font-weight: 700;
            color: var(--text);
            line-height: 1;
        }

        /* ── TABLES ── */
        .table-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .table-card-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-card-header h5 {
            margin: 0;
            font-size: 15px;
            font-weight: 600;
        }

        .table { margin: 0 !important; }

        .table thead th {
            background: #f8fafc;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.6px;
            border-bottom: 1px solid var(--border) !important;
            padding: 12px 16px !important;
        }

        .table tbody td {
            padding: 12px 16px !important;
            font-size: 14px;
            border-bottom: 1px solid var(--border) !important;
            vertical-align: middle;
        }

        .table tbody tr:last-child td { border-bottom: none !important; }
        .table tbody tr:hover { background: #f8fafc; }

        /* ── BUTTONS ── */
        .btn {
            font-weight: 500 !important;
            font-size: 13px !important;
            border-radius: var(--radius-sm) !important;
            padding: 8px 16px !important;
            transition: all 0.2s !important;
        }

        .btn-primary {
            background: var(--primary) !important;
            border-color: var(--primary) !important;
        }
        .btn-primary:hover {
            background: var(--primary-light) !important;
            border-color: var(--primary-light) !important;
        }

        .btn-success {
            background: #16a34a !important;
            border-color: #16a34a !important;
        }

        .btn-warning {
            background: var(--accent) !important;
            border-color: var(--accent) !important;
            color: #1a1a2e !important;
        }
        .btn-warning:hover {
            background: var(--accent-light) !important;
        }

        .btn-danger {
            background: var(--danger) !important;
            border-color: var(--danger) !important;
        }

        .btn-info {
            background: #0284c7 !important;
            border-color: #0284c7 !important;
            color: white !important;
        }

        .btn-sm { padding: 5px 12px !important; font-size: 12px !important; }

        /* ── FORMS ── */
        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            border: 1.5px solid var(--border) !important;
            border-radius: var(--radius-sm) !important;
            font-size: 14px !important;
            padding: 9px 13px !important;
            transition: border-color 0.2s !important;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--primary) !important;
            box-shadow: 0 0 0 3px rgba(10,79,46,0.1) !important;
        }

        /* ── BADGES ── */
        .badge {
            font-size: 11px !important;
            font-weight: 600 !important;
            padding: 5px 10px !important;
            border-radius: 6px !important;
        }

        /* ── SECTION HEADING ── */
        .section-heading {
            font-size: 17px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-heading::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
            margin-left: 8px;
        }

        /* ── DIVIDER ── */
        hr {
            border-color: var(--border) !important;
            opacity: 1 !important;
            margin: 24px 0 !important;
        }

        /* ── SCROLLBAR ── */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }

        /* ════════════════════════════════
           RESPONSIVE BREAKPOINTS
        ════════════════════════════════ */

        /* Tablet — sidebar still visible but narrower */
        @media (max-width: 991px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .sidebar-close-btn {
                display: flex;
            }

            .mobile-topbar {
                display: flex;
            }

            .content {
                margin-left: 0;
                padding: 24px 20px;
                padding-top: calc(var(--topbar-h) + 20px);
            }
        }

        /* Phone */
        @media (max-width: 575px) {
            .content {
                padding: 16px 14px;
                padding-top: calc(var(--topbar-h) + 14px);
            }

            .topbar {
                margin-bottom: 20px;
                gap: 10px;
            }

            .topbar .page-title {
                font-size: 18px;
            }

            /* Stack topbar buttons below title on very small screens */
            .topbar > div:last-child {
                width: 100%;
            }

            .topbar .d-flex.flex-wrap {
                gap: 8px !important;
            }

            .topbar .btn {
                flex: 1 1 auto;
                text-align: center;
                font-size: 12px !important;
                padding: 7px 10px !important;
            }

            .stat-card {
                padding: 16px 18px;
                gap: 14px;
            }

            .stat-icon {
                width: 44px; height: 44px;
                font-size: 18px;
            }

            .stat-value {
                font-size: 22px;
            }

            .table thead th {
                font-size: 10px;
                padding: 10px 12px !important;
                white-space: nowrap;
            }

            .table tbody td {
                font-size: 13px;
                padding: 10px 12px !important;
            }

            .table-card-header {
                padding: 14px 16px;
            }

            .section-heading {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar overlay for mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Mobile top bar -->
    <div class="mobile-topbar">
        <button class="hamburger" id="sidebarToggle" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
        </button>
        <div class="mob-logo">
            <div class="logo-icon">🏦<img src="{% static 'countrywide/images/CW_Logo.jpg' %}" alt="Logo"> </div>
            <span>CountryWideMoney</span>
        </div>
    </div>

    {% include 'borrowers/sidebar.html' %}

    <div class="content">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const sidebar   = document.querySelector('.sidebar');
        const overlay   = document.getElementById('sidebarOverlay');
        const toggleBtn = document.getElementById('sidebarToggle');
        const closeBtn  = document.querySelector('.sidebar-close-btn');

        function openSidebar() {
            sidebar.classList.add('open');
            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeSidebar() {
            sidebar.classList.remove('open');
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        toggleBtn && toggleBtn.addEventListener('click', openSidebar);
        closeBtn  && closeBtn.addEventListener('click', closeSidebar);
        overlay   && overlay.addEventListener('click', closeSidebar);
    </script>
</body>
</html>
