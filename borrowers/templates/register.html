<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Borrower — CountryWide Lending and Services</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary:       #0a4f2e;
            --primary-light: #0e6b3e;
            --accent:        #c9a02a;
            --bg:            #f4f6f9;
            --border:        #e2e8f0;
            --shadow:        0 2px 12px rgba(0,0,0,0.08);
            --radius:        12px;
            --radius-sm:     8px;
            --text:          #1a1a2e;
            --text-muted:    #6c757d;
            --sidebar-width: 260px;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Inter', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
        }

        /* Inline sidebar styles (same as base.html) */
        .sidebar {
            width: var(--sidebar-width);
            min-height: 100vh;
            background: linear-gradient(180deg, #062d1a 0%, var(--primary) 100%);
            color: white;
            position: fixed;
            top: 0; left: 0;
            display: flex;
            flex-direction: column;
            z-index: 100;
            box-shadow: 4px 0 20px rgba(0,0,0,0.15);
        }

        .content {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 32px 36px;
            min-height: 100vh;
        }

        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .page-title { font-size: 22px; font-weight: 700; }

        .card {
            border: none !important;
            border-radius: var(--radius) !important;
            box-shadow: var(--shadow) !important;
            background: #fff !important;
        }

        .form-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        /* Style Django's as_p output */
        p { margin-bottom: 16px; }

        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="tel"],
        input[type="file"],
        textarea,
        select {
            width: 100%;
            padding: 9px 13px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-family: 'Inter', Arial, sans-serif;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
            background: white;
        }

        input:focus, textarea:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(10,79,46,0.1);
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            border-radius: var(--radius-sm);
            padding: 11px 28px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', Arial, sans-serif;
            transition: opacity 0.2s;
        }

        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

    {% include 'borrowers/sidebar.html' %}

    <div class="content">

        <div class="topbar">
            <div>
                <div class="page-title">Register Borrower</div>
                <div style="font-size:13px; color:var(--text-muted); margin-top:2px;">
                    Add a new borrower to the system
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="card">
                    <div class="card-body p-4">

                        <div class="d-flex align-items-center gap-3 mb-4 pb-3" style="border-bottom:1px solid var(--border);">
                            <div style="width:44px; height:44px; border-radius:10px; background:rgba(10,79,46,0.12); display:flex; align-items:center; justify-content:center; font-size:18px; color:var(--primary);">
                                <i class="fa-solid fa-user-plus"></i>
                            </div>
                            <div>
                                <div style="font-weight:700; font-size:16px;">Borrower Registration Form</div>
                                <div style="font-size:12px; color:var(--text-muted);">Fill in all required information</div>
                            </div>
                        </div>

                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            {{ form.as_p }}
                            <div class="mt-3">
                                <button type="submit" class="btn-submit">
                                    <i class="fa-solid fa-user-plus me-2"></i>Register Borrower
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
